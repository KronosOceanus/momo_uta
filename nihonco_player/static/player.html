<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>逐句练习</title><link rel="stylesheet" href="/static/player.css"></head><body>
<aside>
  <div class="top"><div class="improw"><button id="newlist" title="新建歌单">＋ 新建歌单</button></div>
    <input id="q" placeholder="搜索歌名 / 歌手"></div>
  <div id="list"></div></aside>
<main>
 <div class="hdr"><button id="start">开始</button><span id="vtitle">—</span>
  <span class="chip" id="offchip" hidden></span>
  <span class="modes">
   <button id="edit">振假名编辑模式：关</button><button id="lrcedit">LRC 编辑模式：关</button>
  </span></div>
 <div class="bar lrcgrid" id="lrcbar" hidden>
  <span class="left"><button id="lrcadd" title="在选中行下面加一行">加行</button>
   <button id="lrcpaste" title="粘贴多行文本，自动拆成多行">粘贴</button>
   <button id="lrcselall" title="选中所有行（⌘A）">全选</button>
   <button id="lrcdel" title="删除选中的行（Delete）">删除</button></span>
  <span class="mid"><button id="lrcsave">保存</button><button id="lrcsaveas">另存为</button>
   <button id="lrcreset" title="把最早那次保存前的版本恢复回来">恢复最初</button></span>
  <span class="off"><span class="oflab">整体偏移</span>
   <button data-off="-0.5">−0.5s</button><button data-off="-0.1">−0.1s</button>
   <b id="offval">0.00s</b>
   <button data-off="0.1">+0.1s</button><button data-off="0.5">+0.5s</button>
  </span></div>
 <div class="bar" id="fakbar" hidden><button id="resetall">全部重置</button>
  <span class="legend">A <span style="color:#7fbfa6">●</span> AB <span style="color:#c8843f">●</span> B <span style="color:#6d737c">●</span> C <span style="opacity:.5">●</span></span></div>
 <div class="wavewrap" id="wavewrap">
  <canvas id="wave" height="120"></canvas>
  <div class="wavehint" id="wavehint">点波形定位；滚轮缩放</div>
 </div>
 <div class="split">
  <div class="lyr" id="lyr"></div>
  <div class="side"><div class="tg"><button id="t-rm" class="on">罗马音</button><button id="t-ky">键位</button></div>
   <div class="rm2" id="rmcol"></div></div>
 </div>
 <div class="bar2"><h1 id="ttl">选一首歌</h1>
  <div class="btns">
   <button id="prev">◀ 上一句</button><button id="play">播放</button><button id="next">下一句 ▶</button>
   <button id="loop">单句循环</button><button id="rem">重新匹配歌词</button>
  </div>
  <label style="color:var(--dim);font-size:12px;justify-self:end;white-space:nowrap">速度 <input id="rate" type="range" min="__SMIN__" max="__SMAX__" step="__SSTEP__" value="1" style="width:80px;vertical-align:middle"><span id="rv">1.00×</span></label>
 </div>
 <audio id="au" controls></audio>
</main>
<script src="/static/player.js"></script></body></html>
