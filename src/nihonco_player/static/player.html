<!doctype html><html lang="ja" data-theme="dark"><head><meta charset="utf-8"><title>nihonco uta</title><link rel="stylesheet" href="/static/player.css"></head><body>
<aside>
  <div class="top"><input id="q" placeholder="搜索歌名 / 歌手">
    <div class="improw"><button id="newlist" title="新建歌单">＋ 新建歌单</button></div></div>
  <div id="list"></div>
  <div class="asidefoot">
    <button id="datadir" title="打开数据目录（Application Support/nihonco uta/data）">📁 数据路径</button>
    <button id="theme" title="切换日间/夜间模式">🌙 夜间模式</button>
  </div>
 </aside>
<main>
 <div class="hdr"><button id="start">开始</button><span id="vtitle">—</span>
  <span class="chip" id="offchip" hidden></span>
  <div class="vtaskwrap" id="vtaskwrap">
    <span class="chip" id="vchip" hidden></span>
    <span class="chip vbg" id="vbackground" hidden></span>
    <div class="vtasks" id="vtasks" hidden role="dialog" aria-label="人声分离任务">
      <div class="vtt">人声分离任务</div>
      <div id="vtasklist"></div>
      <button class="vcall" id="vcancelall" hidden>取消全部人声</button>
    </div>
  </div>
  <button id="rem" title="重新匹配当前查看歌曲的歌词">重新匹配歌词</button>
  <span class="modes">
   <button id="edit">振假名编辑模式：关</button><button id="lrcedit">LRC 编辑模式：关</button>
  </span></div>
 <div class="bar" id="fakbar" hidden><span class="legend" id="legend">A <span style="color:var(--accent-soft)">●</span> AB <span style="color:var(--amber)">●</span> B <span style="color:var(--muted-2)">●</span> C <span style="opacity:.5">●</span></span><button id="resetall">全部重置</button></div>
 <div class="bar lrcrow" id="lrcrow2" hidden>
  <span class="left"><button id="lrcselall" title="选中所有行（⌘A）">全选</button>
   <button id="lrcadd" title="在选中行下面加一行">加行</button>
   <button id="lrcdel" title="删除选中的行（Delete）">删行</button></span>
  <span class="mid"><button id="lrctrans" title="显示翻译输入框">翻译：关</button></span>
  <span class="right"><span class="savehint" id="savehint"></span>
   <button id="lrcsave">保存</button><button id="lrcsaveas">导出</button>
   <button id="lrcimport" title="选一个 .lrc 直接覆盖当前歌词">导入</button>
   <button id="lrcfiledel" class="danger" title="删除这首歌的 nhlrc 和备份">删除</button>
   <button id="lrcreset" title="把最早那次保存前的版本恢复回来">恢复最初</button></span>
 </div>
 <div class="bar lrcrow" id="lrcrow3" hidden>
  <button id="wavefollow" class="left" title="波形是否跟着播放滚动">跟随：开</button>
  <span class="right off"><span class="oflab">整体偏移</span>
   <button data-off="-0.5">−0.5s</button><button data-off="-0.1">−0.1s</button>
   <b id="offval" title="点击输入偏移">0.00s</b>
   <button data-off="0.1">+0.1s</button><button data-off="0.5">+0.5s</button></span>
 </div>
 <div class="wavewrap" id="wavewrap">
  <canvas id="wave" height="120"></canvas>
  <div class="wavehint" id="wavehint"></div>
 </div>
 <div class="bar wavebar" id="wavebar" hidden>
  <span class="left jgrp"><button id="jumpback">◀ 5s</button><button id="jumpfwd">5s ▶</button></span>
  <span class="mid fgrp"><button data-seek="-1">◀ 1s</button><button data-seek="-0.1">◀ 0.1s</button>
   <button data-seek="0.1">0.1s ▶</button><button data-seek="1">1s ▶</button></span>
  <span class="right zgrp"><button id="zoomout" title="窗口 −1 秒">缩小</button>
   <b id="zoomval" title="点击输入窗口秒数">5s</b>
   <button id="zoomin" title="窗口 +1 秒">放大</button></span>
 </div>
 <div class="split">
  <div class="lyr" id="lyr"></div>
  <div class="side"><div class="tg"><button id="t-rm" class="on">罗马音</button><button id="t-ky">键位</button></div>
   <div class="rm2" id="rmcol"></div></div>
 </div>
 <div class="bar2">
  <button id="prev" class="line1">◀ 上一句</button>
  <button id="next" class="line2">下一句 ▶</button>
  <button id="loop" class="line3">单句循环：关</button>
  <h1 id="ttl">选一首歌</h1>
  <button id="prevSong" class="song1">◀ 上一首</button>
  <button id="nextSong" class="song2">下一首 ▶</button>
  <button id="songloop" class="song3 on">单曲循环：开</button>
  <label class="speed">速度 <input id="rate" type="range" min="0.5" max="1.25" step="0.05" value="1" style="width:80px;vertical-align:middle"><span id="rv">1.00×</span></label>
 </div>
 <div class="transport">
  <button id="back10" class="tb" title="后退 10 秒">⟲10</button>
  <button id="play2" class="tb big" type="button" title="播放 / 暂停"><span id="play2ico">▶</span></button>
  <button id="fwd10" class="tb" title="前进 10 秒">10⟳</button>
  <span class="tm" id="tcur">0:00</span>
  <div class="seek" id="seek"><div class="fill" id="fill"></div>
    <div class="ticks" id="ticks"></div><div class="thumb" id="thumb"></div></div>
  <span class="tm" id="tdur">0:00</span>
  <span class="vol"><button id="mute" class="tb" title="静音">🔊</button>
    <input id="volume" type="range" min="0" max="1" step="0.05" value="1"></span>
 </div>
 <audio id="au" preload="metadata"></audio>
</main>
<script src="/static/05-audio.js?v=2"></script>
<script src="/static/06-state.js?v=2"></script>
<script src="/static/10-app.js?v=2"></script>
<script src="/static/11-vocals.js?v=2"></script>
<script src="/static/12-library.js?v=2"></script>
<script src="/static/20-editor.js?v=2"></script>
<script src="/static/30-playback.js?v=2"></script>
<script src="/static/40-shortcuts.js?v=2"></script></body></html>
